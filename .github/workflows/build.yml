name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk cinejoy-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cinejoy-tv
          path: cinejoy-tv.apk
      # Publishes a stable public URL that the Fire TV "Downloader" app can fetch:
      # https://github.com/<user>/<repo>/releases/latest/download/cinejoy-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CineJoy TV build ${{ github.run_number }}
          files: cinejoy-tv.apk
          make_latest: true
