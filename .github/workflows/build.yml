name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # The fixed release key lives in the KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets (see README).
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See 'Signing key' in the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Builds every flavor: one APK per site.
      - run: gradle assembleRelease
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: |
          cp app/build/outputs/apk/cinejoy/release/app-cinejoy-release.apk cinejoy-tv.apk
          cp app/build/outputs/apk/nhl/release/app-nhl-release.apk nhl-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*.apk"
      # Only main publishes a release. Other branches just check that the build works.
      # Stable public URLs that the Fire TV "Downloader" app can fetch:
      # https://github.com/<user>/<repo>/releases/latest/download/cinejoy-tv.apk
      # https://github.com/<user>/<repo>/releases/latest/download/nhl-tv.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fire TV apps build ${{ github.run_number }}
          files: |
            cinejoy-tv.apk
            nhl-tv.apk
          make_latest: true
